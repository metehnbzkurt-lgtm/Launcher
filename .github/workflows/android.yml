name: Android Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip varsa ac (ic ice klasor olsa da olur)
        run: |
          ZIP=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP" ]; then
            echo "Zip bulundu: $ZIP"
            rm -rf _extracted && mkdir _extracted
            unzip -q -o "$ZIP" -d _extracted
            ROOT=$(find _extracted -maxdepth 3 -name settings.gradle.kts -not -path '*/__MACOSX/*' | head -n 1 | xargs -r dirname)
            if [ -z "$ROOT" ]; then echo "Zip icinde settings.gradle.kts bulunamadi"; exit 1; fi
            rm -rf "$ROOT/.github"
            cp -a "$ROOT"/. .
            rm -rf _extracted
          fi
          test -f app/build.gradle.kts || { echo "app/build.gradle.kts bulunamadi"; exit 1; }
          ls -la . app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
